<!DOCTYPE html>
<!-- Intentionally inaccessible fixture: every block below trips exactly one rule
     the audit checks. The <html> has NO lang attribute (html-has-lang) and the
     document has NO <title> (document-title). -->
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <!-- heading-order: first heading is <h3> (not h1), then a jump to <h5> -->
  <h3>Welcome</h3>
  <h5>Subsection</h5>

  <!-- image-alt: informative image with no alt. The second img is decorative
       (alt="") and must NOT be flagged. -->
  <img src="chart.png">
  <img src="spacer.gif" alt="">

  <!-- control-name: a text input whose only "label" is a placeholder (not a
       real accessible name). The labelled input below must NOT be flagged. -->
  <input type="text" placeholder="Search">
  <label for="email">Email</label>
  <input type="text" id="email">

  <!-- button-name: icon-only button with no text/aria-label. The named button
       must NOT be flagged. -->
  <button><span aria-hidden="true">&#9776;</span></button>
  <button aria-label="Close">&times;</button>

  <!-- link-name: an anchor with an href but no text/aria-label, plus an ARIA
       link widget (role="link") with no name. The named ones must NOT fire. -->
  <a href="/settings"></a>
  <a href="/home">Home</a>
  <span role="link" tabindex="0"></span>
  <span role="link" tabindex="0">Docs</span>

  <!-- button-name via button-like inputs: type=button with no value and
       type=image with no alt both offend; submit (default label), a valued
       button, and an alt'd image button must NOT fire. -->
  <input type="button">
  <input type="image" src="go.png">
  <input type="submit">
  <input type="button" value="OK">
  <input type="image" src="go.png" alt="Search">
  <!-- label set at RUNTIME via the live .value property (no value attribute in
       the markup) — must be read as named, not flagged (regression guard). -->
  <input type="button" id="dynbtn">
  <script>document.getElementById('dynbtn').value = 'Go';</script>

  <!-- positive-tabindex -->
  <input type="text" id="phone" aria-label="Phone" tabindex="3">

  <!-- duplicate-id: 'dup' appears twice -->
  <div id="dup">one</div>
  <div id="dup">two</div>
</body>
</html>
